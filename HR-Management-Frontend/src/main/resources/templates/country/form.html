<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Edit Country' : 'Add Country'">Country Form</title>
    <style>
        body  { font-family: sans-serif; margin: 24px; max-width: 480px; }
        h1    { margin-bottom: 20px; }
        .field { margin-bottom: 16px; display: flex; flex-direction: column; gap: 4px; }
        label { font-weight: bold; font-size: 0.9em; }
        input, select {
            padding: 8px; border: 1px solid #ccc; border-radius: 4px;
            font-size: 1em; width: 100%; box-sizing: border-box;
        }
        input[readonly] { background: #f5f5f5; color: #666; cursor: not-allowed; }
        .error { color: #c62828; font-size: 0.85em; }
        .api-error {
            color: #c62828; background: #fff0f0;
            border: 1px solid #f5c6c6;
            padding: 10px 14px; border-radius: 4px; margin-bottom: 14px;
        }
        .actions { display: flex; gap: 10px; margin-top: 8px; }
        .btn-submit {
            padding: 8px 20px; background: #1976D2; color: white;
            border: none; border-radius: 4px; font-size: 1em; cursor: pointer;
        }
        .btn-submit:hover { background: #1565c0; }
        .btn-cancel {
            padding: 8px 16px; text-decoration: none; color: #555;
            border: 1px solid #ccc; border-radius: 4px; font-size: 1em;
        }
    </style>
</head>
<body>

<h1 th:text="${isEdit} ? 'Edit Country' : 'Add Country'">Country Form</h1>

<div class="api-error"
     th:if="${apiError != null and !#strings.isEmpty(apiError)}"
     th:text="${apiError}"></div>

<form th:action="@{/countries/save}" th:object="${country}" method="post">

    <!-- Hidden ID for updates — empty on create -->
    <input type="hidden" th:field="*{countryId}" th:if="${isEdit}"/>

    <!-- Country ID visible field (readonly on edit) -->
    <div class="field">
        <label for="countryId">Country ID</label>
        <input id="countryId"
               th:if="${!isEdit}"
               th:field="*{countryId}"
               placeholder="e.g. US (letters only, max 4)"/>
        <input id="countryId"
               th:if="${isEdit}"
               th:value="${country.countryId}"
               readonly="readonly"/>
        <span class="error"
              th:if="${#fields.hasErrors('countryId')}"
              th:errors="*{countryId}"></span>
    </div>

    <!-- Country Name -->
    <div class="field">
        <label for="countryName">Country Name</label>
        <input id="countryName"
               th:field="*{countryName}"
               placeholder="e.g. United States"/>
        <span class="error"
              th:if="${#fields.hasErrors('countryName')}"
              th:errors="*{countryName}"></span>
    </div>

    <!-- Region dropdown -->
	<div class="field">
	    <label for="regionId">Region</label>
		<select id="regionId" name="regionId">
		    <option value="">-- Select Region --</option>
		    <option th:each="r : ${regions}"
		            th:value="${r['regionId']}"
		            th:text="${r['regionName']}"
		            th:selected="${country.regionId != null
		                           and country.regionId.intValue() == r['regionId']}">
		    </option>
		</select>
	    <span class="error"
	          th:if="${#fields.hasErrors('regionId')}"
	          th:errors="*{regionId}"></span>
	</div>

    <div class="actions">
        <button class="btn-submit" type="submit"
                th:text="${isEdit} ? 'Update Country' : 'Add Country'">Submit</button>
        <a class="btn-cancel" th:href="@{/countries}">Cancel</a>
    </div>

</form>
</body>
</html>
