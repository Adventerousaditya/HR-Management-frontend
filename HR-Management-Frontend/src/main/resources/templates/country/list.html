
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Countries</title>
    <style>
        body { font-family: sans-serif; margin: 24px; }
        table { border-collapse: collapse; width: 100%; margin-top: 16px; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background: #f0f0f0; }
        tr[data-href]:hover { background: #f9f9f9; cursor: pointer; }
        .success { color: green; background: #efffef; border: 1px solid #b2d8b2;
                   padding: 8px 14px; border-radius: 4px; margin-bottom: 12px; }
        .btn { padding: 6px 12px; text-decoration: none; border-radius: 4px;
               background: #4CAF50; color: white; font-size: 0.9em; }
        .link-edit { text-decoration: none; color: #1565c0; }
        .pagination { margin-top: 14px; }
        .pagination a { margin: 0 6px; }
    </style>
</head>
<body>

<h1>Countries</h1>

<!-- Flash success message -->
<div class="success" th:if="${message != null and !#strings.isEmpty(message)}"
     th:text="${message}"></div>

<a class="btn" href="/countries/new">+ Add Country</a>

<table>
    <thead>
        <tr>
            <th>Country ID</th>
            <th>Country Name</th>
            <th>Region</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="c : ${countries}"
            th:data-href="@{/countries/{id}(id=${c['countryId']})}"
            onclick="window.location=this.dataset.href">
            <td th:text="${c['countryId']}"></td>
            <td th:text="${c['countryName']}"></td>
            <td th:text="${c['region'] != null ? c['region']['regionName'] : ''}"></td>
            <td>
                <a class="link-edit"
                   th:href="@{/countries/edit/{id}(id=${c['countryId']})}"
                   onclick="event.stopPropagation()">Edit</a>
            </td>
        </tr>
    </tbody>
</table>

<div class="pagination">
    <a th:if="${currentPage > 0}"
       th:href="@{/countries(page=${currentPage - 1})}">← Prev</a>

    <span th:text="'Page ' + (${currentPage + 1}) + ' of ' + ${totalPages}"
          style="margin: 0 12px"></span>

    <a th:if="${currentPage + 1 < totalPages}"
       th:href="@{/countries(page=${currentPage + 1})}">Next →</a>
</div>

</body>
</html>
