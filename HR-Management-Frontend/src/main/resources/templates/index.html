<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<header>
    <h1>HR Management</h1>
</header>

<main>
    <h2>Our Team</h2>

    <div class="grid">

        <!-- Card 1 — You → Countries -->
        <div class="card">
            <img th:src="@{/images/photo1.jpg}" alt="Your photo" />
            <div class="card-body">
                <span class="card-name">You</span>
                <span class="card-role">Countries</span>
                <a th:href="@{/countries}" class="card-link">View Table</a>
            </div>
        </div>

        <!-- Card 2 — TM 2 → Regions -->
        <div class="card">
            <img th:src="@{/images/photo2.jpg}" alt="TM 2 photo" />
            <div class="card-body">
                <span class="card-name">TM 2</span>
                <span class="card-role">Regions</span>
                <a th:href="@{/regions}" class="card-link">View Table</a>
            </div>
        </div>

        <!-- Card 3 — TM 3 → Locations -->
        <div class="card">
            <img th:src="@{/images/photo3.jpg}" alt="TM 3 photo" />
            <div class="card-body">
                <span class="card-name">TM 3</span>
                <span class="card-role">Locations</span>
                <a th:href="@{/locations}" class="card-link">View Table</a>
            </div>
        </div>

        <!-- Card 4 — TM 4 → Departments -->
        <div class="card">
            <img th:src="@{/images/photo4.jpg}" alt="TM 4 photo" />
            <div class="card-body">
                <span class="card-name">TM 4</span>
                <span class="card-role">Departments</span>
                <a th:href="@{/department}" class="card-link">View Table</a>
            </div>
        </div>

        <!-- Card 5 — TM 5 → Employees -->
        <div class="card">
            <img th:src="@{/images/photo5.jpg}" alt="TM 5 photo" />
            <div class="card-body">
                <span class="card-name">TM 5</span>
                <span class="card-role">Employees</span>
                <a th:href="@{/employees}" class="card-link">View Table</a>
            </div>
        </div>

        <!-- Card 6 — TM 6 → Jobs -->
        <div class="card">
            <img th:src="@{/images/photo6.jpg}" alt="TM 6 photo" />
            <div class="card-body">
                <span class="card-name">TM 6</span>
                <span class="card-role">Jobs</span>
                <a th:href="@{/jobs}" class="card-link">View Table</a>
            </div>
        </div>

    </div>
</main>

<footer>
    <span>HR Management Portal</span>
    <span>Phase 2 — Home Page</span>
</footer>

</body>
</html>
