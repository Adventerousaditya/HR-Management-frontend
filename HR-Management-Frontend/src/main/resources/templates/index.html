<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<header>
    <h1>HR Management</h1>
</header>

<main>
    <h2>Our Team</h2>

    <div class="grid">

        <div class="card">
            <img th:src="@{/images/photo1.jpg}" alt="Tithaye Beri" />
            <div class="card-body">
                <span class="card-name">Tithaye Beri</span>
                <span class="card-role">Countries</span>
                <a th:href="@{/countries}" class="card-link">View Table</a>
            </div>
        </div>
		
        <div class="card">
            <img th:src="@{/images/photo2.jpg}" alt="Ayush Sirohi" />
            <div class="card-body">
                <span class="card-name">Ayush Sirohi</span>
                <span class="card-role">Regions</span>
                <a th:href="@{/regions}" class="card-link">View Table</a>
            </div>
        </div>

       
        <div class="card">
            <img th:src="@{/images/photo3.jpg}" alt="Aditya Yadav" />
            <div class="card-body">
                <span class="card-name">Aditya Yadav</span>
                <span class="card-role">Locations</span>
                <a th:href="@{/locations}" class="card-link">View Table</a>
            </div>
        </div>

        <div class="card">
            <img th:src="@{/images/photo4.jpg}" alt="Akhya Rastogi" />
            <div class="card-body">
                <span class="card-name">Akhya Rastogi</span>
                <span class="card-role">Departments</span>
                <a th:href="@{/departments}" class="card-link">View Table</a>
            </div>
        </div>

        <div class="card">
            <img th:src="@{/images/photo5.jpg}" alt="Suyash Kumar Jaiswal" />
            <div class="card-body">
                <span class="card-name">Suyash Kumar Jaiswal</span>
                <span class="card-role">Employees</span>
                <a th:href="@{/employees}" class="card-link">View Table</a>
            </div>
        </div>

        <div class="card">
            <img th:src="@{/images/photo6.jpg}" alt="Khushi Tomar" />
            <div class="card-body">
                <span class="card-name">Khushi Tomar</span>
                <span class="card-role">Jobs</span>
                <a th:href="@{/jobs}" class="card-link">View Table</a>
            </div>
        </div>

    </div>
</main>

<footer>
    <span>HR Management Portal</span>
    <span>Phase 2 — Home Page</span>
</footer>

</body>
</html>
