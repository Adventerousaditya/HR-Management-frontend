<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Department</title>
  <link rel="stylesheet" th:href="@{/css/dept.css}"/>
</head>
<body>
<div class="page-wrapper">

  <div class="back-row">
    <a href="/departments" class="back-link">&#8592; Back to Departments</a>
  </div>

  <div class="page-header">
    <h1 class="page-title">Add New Department</h1>
  </div>

  <div th:if="${param.error}" class="alert alert-error">
    <span th:text="${param.error[0]}"></span>
  </div>

  <div class="add-form-card">
    <form method="post" action="/departments/create">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="departmentId">Department ID</label>
          <input id="departmentId" type="number" name="departmentId"
                 class="form-control" placeholder="e.g. 270" required/>
        </div>
        <div class="form-group">
          <label class="form-label" for="departmentName">Department Name</label>
          <input id="departmentName" type="text" name="departmentName"
                 class="form-control" placeholder="e.g. Operations"
                 required maxlength="30"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="locationId">Location ID</label>
          <input id="locationId" type="number" name="locationId"
                 class="form-control" placeholder="e.g. 1700" required/>
        </div>
        <div class="form-group">
          <label class="form-label" for="managerId">
            Manager Employee ID <span class="optional">(optional)</span>
          </label>
          <input id="managerId" type="number" name="managerId"
                 class="form-control" placeholder="e.g. 108"/>
        </div>
      </div>
      <div class="form-actions">
        <a href="/departments" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary">Create Department</button>
      </div>
    </form>
  </div>

</div>
</body>
</html>
