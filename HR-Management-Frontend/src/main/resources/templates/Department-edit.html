<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="'Edit ' + ${department != null
          ? department['departmentName'] : ''}">Edit Department</title>
  <link rel="stylesheet" th:href="@{/css/dept.css}"/>
</head>
<body>
<div class="page-wrapper">

  <div class="back-row">
    <a th:href="@{'/departments/' + ${department != null
                  ? department['departmentId'] : ''}}"
       class="back-link">&#8592; Back to Department</a>
  </div>

  <div class="page-header">
    <h1 class="page-title"
        th:text="'Edit ' + ${department != null
                  ? department['departmentName'] : ''}">
      Edit Department</h1>
  </div>

  <div th:if="${error}" class="alert alert-error">
    <span th:text="${error}"></span>
  </div>

  <div class="add-form-card" th:if="${department != null}">
    <form th:action="@{'/departments/' + ${department['departmentId']} + '/update'}"
          method="post">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="deptName">Department Name</label>
          <input id="deptName" type="text" name="departmentName"
                 class="form-control"
                 th:value="${department['departmentName']}"
                 required maxlength="30"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="locId">Location ID</label>
          <input id="locId" type="number" name="locationId"
                 class="form-control"
                 th:value="${department['locationId']}"
                 required/>
        </div>
      </div>
      <div class="form-actions">
        <a th:href="@{'/departments/' + ${department['departmentId']}}"
           class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>

</div>
</body>
</html>
