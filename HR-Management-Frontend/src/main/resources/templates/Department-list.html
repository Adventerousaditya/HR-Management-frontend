<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Department Management</title>
  <link rel="stylesheet" th:href="@{/css/dept.css}"/>
</head>
<body>
<div class="page-wrapper">

  <!-- Header -->
  <div class="page-header">
    <h1 class="page-title">Department Management</h1>
    <a href="/departments/new" class="btn btn-primary">
      <span class="plus-icon">+</span> Add Department
    </a>
  </div>

  <!-- Flash messages -->
  <div th:if="${param.success}" class="alert alert-success">
    <span th:text="${param.success[0]}"></span>
  </div>
  <div th:if="${param.error}" class="alert alert-error">
    <span th:text="${param.error[0]}"></span>
  </div>
  <div th:if="${error}" class="alert alert-error">
    <span th:text="${error}"></span>
  </div>

  <!-- ── Unified Single Search Bar ── -->
  <div class="search-card">
    <form action="/departments/search" method="get">
      <div class="search-row">

        <div class="form-group">
          <label class="form-label">Search By</label>
          <select name="searchType" class="form-control select-control">
            <option value="name"
                    th:selected="${searchMode == 'name'}">Department Name</option>
            <option value="id"
                    th:selected="${searchMode == 'id'}">Department ID</option>
            
          </select>
        </div>

        <div class="form-group search-input-grow">
          <label class="form-label">Search Value</label>
          <div class="search-input-row">
            <input type="text" name="query" class="form-control"
                   placeholder="Type a Department Name or Department Id..."
                   th:value="${searchValue != null ? searchValue : ''}"/>
            <button type="submit" class="btn btn-primary">Search</button>
            <a th:if="${searchMode != null}"
               href="/departments" class="btn btn-ghost">&#x2715; Clear</a>
          </div>
        </div>

      </div>

      <!-- Active result banner -->
      <div th:if="${searchMode != null}" class="search-active-banner">
        <span th:if="${searchMode == 'name'}">
          Results for department name: <strong th:text="${searchValue}"></strong>
        </span>
        <span th:if="${searchMode == 'id'}">
          Results for department ID: <strong th:text="${searchValue}"></strong>
        </span>
       
      </div>

    </form>
  </div>

  <!-- ── Table ── -->
  <div class="table-card">

    <div class="table-meta">
      <span class="total-label"
            th:text="${totalElements} + ' department' + (${totalElements} != 1 ? 's' : '') + ' found'">
      </span>
      <span class="page-label" th:if="${searchMode == null}"
            th:text="'Page ' + (${currentPage} + 1) + ' of ' + ${totalPages}">
      </span>
    </div>

    <table class="dept-table">
      <thead>
        <tr>
          <th>Department ID</th>
          <th>Department Name</th>
          <th>Manager ID</th>
          <th>Location</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(departments)}">
          <td colspan="5" class="empty-cell">No departments found.</td>
        </tr>
        <tr th:each="dept : ${departments}">
          <td th:text="${dept['departmentId']}">—</td>
          <td th:text="${dept['departmentName']}">—</td>
          <td th:text="${dept['managerId'] != null and dept['managerId'] != ''
                         ? dept['managerId'] : '—'}">—</td>
          <td th:text="${dept['locationCity'] != null and dept['locationCity'] != ''
                         ? dept['locationCity'] + (dept['locationState'] != null
                           and dept['locationState'] != ''
                           ? ', ' + dept['locationState'] : '') : '—'}">—</td>
          <td class="action-cell">
            <a th:href="@{'/departments/' + ${dept['departmentId']}}"
               class="btn btn-primary btn-sm">View Details</a>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Pagination — only when not searching -->
    <div class="pagination" th:if="${searchMode == null and totalPages > 1}">

      <a th:if="${currentPage > 0}"
         th:href="@{/departments(page=${currentPage - 1}, size=${pageSize})}"
         class="page-btn">&#8592; Prev</a>
      <span th:unless="${currentPage > 0}"
            class="page-btn page-btn--disabled">&#8592; Prev</span>

      <th:block th:with="start=${currentPage > 3 ? currentPage - 2 : 0},
                         end=${currentPage + 4 < totalPages ? currentPage + 3 : totalPages}">

        <th:block th:if="${start > 0}">
          <a th:href="@{/departments(page=0, size=${pageSize})}"
             class="page-btn">1</a>
          <span th:if="${start > 1}" class="page-ellipsis">…</span>
        </th:block>

        <th:block th:each="p : ${#numbers.sequence(start, end - 1)}">
          <a th:if="${p != currentPage}"
             th:href="@{/departments(page=${p}, size=${pageSize})}"
             th:text="${p + 1}" class="page-btn"></a>
          <span th:if="${p == currentPage}"
                th:text="${p + 1}"
                class="page-btn page-btn--active"></span>
        </th:block>

        <th:block th:if="${end < totalPages}">
          <span th:if="${end < totalPages - 1}" class="page-ellipsis">…</span>
          <a th:href="@{/departments(page=${totalPages - 1}, size=${pageSize})}"
             th:text="${totalPages}" class="page-btn"></a>
        </th:block>

      </th:block>

      <a th:if="${currentPage < totalPages - 1}"
         th:href="@{/departments(page=${currentPage + 1}, size=${pageSize})}"
         class="page-btn">Next &#8594;</a>
      <span th:unless="${currentPage < totalPages - 1}"
            class="page-btn page-btn--disabled">Next &#8594;</span>

    </div>

  </div>

</div>
</body>
</html>
